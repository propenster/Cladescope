name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.*
          cache: true
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libegl1 \
            libfuse2 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=install
          cmake --build build --config Release --parallel
      - name: Version
        id: v
        shell: bash
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter cladescope.exe | Select-Object -First 1
          if (-not $exe) { $exe = Get-ChildItem build -Recurse -Filter *.exe | Where-Object { $_.Name -notlike 'tst_*' } | Select-Object -First 1 }
          New-Item -ItemType Directory -Force dist/Cladescope | Out-Null
          Copy-Item $exe.FullName dist/Cladescope/
          windeployqt --release --qmldir . "dist/Cladescope/$($exe.Name)"
          # App-local copy of the Visual C++ runtime so the zip also runs on PCs without the redistributable
          foreach ($d in 'vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll','concrt140.dll') {
            $f = Join-Path $env:SystemRoot "System32\$d"
            if (Test-Path $f) { Copy-Item $f dist/Cladescope/ }
          }
          Get-ChildItem dist/Cladescope/platforms | Format-Table Name, Length
          Compress-Archive -Path dist/Cladescope -DestinationPath "Cladescope-${{ steps.v.outputs.tag }}-windows-x64.zip"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true   # warning only until this has proven reliable on the runner
        shell: pwsh
        run: |
          # Start the packaged app with a stripped PATH (no Qt on it) and check the real window opens
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          $exe = (Get-ChildItem dist/Cladescope -Filter *.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $exe -ArgumentList (Resolve-Path tests/data/small.nwk) -PassThru
          Start-Sleep -Seconds 10
          $p.Refresh()
          Write-Host "Window title: '$($p.MainWindowTitle)'  exited: $($p.HasExited)"
          if ($p.HasExited -or $p.MainWindowTitle -notlike '*small.nwk*') { Write-Error "App did not open its main window"; exit 1 }
          Stop-Process -Id $p.Id -Force

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=$(find build -name "*.app" -maxdepth 3 | head -n1)
          macdeployqt "$APP" -qmldir=.
          # Ad-hoc sign (no Apple account needed). Unsigned/invalid bundles show as "damaged" on Apple Silicon.
          rm -rf "$APP/Contents/PlugIns/sqldrivers"   # unused SQL drivers pull in missing database libraries
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee sign.txt
          grep -q "Sealed Resources version" sign.txt || { echo "App bundle is not sealed"; exit 1; }
          grep -q "Info.plist entries=" sign.txt || { echo "Info.plist is not bound"; exit 1; }
          if grep -q "Info.plist=not bound" sign.txt; then echo "Info.plist is not bound"; exit 1; fi
          mkdir dmgroot
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Cladescope" -srcfolder dmgroot -ov -format UDZO \
            "Cladescope-${{ steps.v.outputs.tag }}-macos-arm64.dmg"

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          cmake --install build
          BIN=$(find install -type f -perm -u+x -name 'Cladescope' -o -type f -perm -u+x -name 'cladescope' | head -n1)
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications
          cp "$BIN" AppDir/usr/bin/Cladescope
          cat > AppDir/usr/share/applications/cladescope.desktop << 'DESK'
          [Desktop Entry]
          Type=Application
          Name=Cladescope
          Exec=Cladescope
          Icon=cladescope
          Categories=Education;Science;Biology;
          DESK
          sed -i 's/^          //' AppDir/usr/share/applications/cladescope.desktop
          ICON_DIR=AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p "$ICON_DIR"
          cp ui/assets/icons/cladescope-C-256.png "$ICON_DIR/cladescope.png"
          # The Qt plugin must sit next to linuxdeploy and keep its "linuxdeploy-plugin-qt" name
          curl -fsSL -o linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-qt-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QML_SOURCES_PATHS="$PWD"
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export OUTPUT="Cladescope-${{ steps.v.outputs.tag }}-linux-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/cladescope.desktop \
            --icon-file "$ICON_DIR/cladescope.png" \
            --executable AppDir/usr/bin/Cladescope --plugin qt --output appimage
          ls -l *.AppImage

      - uses: actions/upload-artifact@v6
        with:
          name: package-${{ runner.os }}
          path: |
            Cladescope-*.zip
            Cladescope-*.dmg
            Cladescope-*.AppImage

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum Cladescope-* > SHA256SUMS.txt
      - name: Draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: assets/*