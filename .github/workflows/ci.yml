name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: QML/JS logic tests
        working-directory: tests/js
        env:
          CANVAS_QML: ${{ github.workspace }}/TreeCanvas.qml
        run: node --stack-size=4000 --test

  build-test:
    name: build + C++ tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.*
          cache: true
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libegl1
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCLADESCOPE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: C++ tests
        run: ctest --test-dir build -C Release --output-on-failure
